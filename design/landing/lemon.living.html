<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>lemon.living</title>
<style>
/* ============================================================
   LEMON.LIVING — restyled introduction
   Single page. Dark-only (Midnight): warm-dark glass, locked to
   match the app. No light/auto theme, no toggle.
   ============================================================ */

:root{
  color-scheme:dark;
  --lemon:#F7C842; --lemondrop:#FEF4CC; --coral:#FF6B46; --citrus:#2D4A1E;
  --linearMark:#9DA4F5; --githubMark:#F2EFE9;
  --statusExecuting:#F7C842; --statusWaiting:#FF6B46; --statusDone:#45C27A;
  --console:#17110A; --consoleText:#E8E0CC;
}
*{box-sizing:border-box;margin:0;padding:0}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-feature-settings:"ss01"}

/* ---- Page shell ---- */
html{background:var(--pageSolid)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  background:var(--page); color:var(--ink); min-height:100vh;
}
.page{max-width:1180px; margin:0 auto; position:relative; overflow:hidden}

/* ---- Theme variables ---------------------------------------
   Dark-only (Midnight): warm-dark glass, locked unconditionally
   to match the app. Warm near-black canvas, #ECE6D8 ink ramp,
   #F7C842 lemon accent. No light palette, no system swap. */
:root{
  --pageSolid:#15100a;
  --page:radial-gradient(125% 80% at 12% -8%, #2f2740 0%, #201a13 42%, #15100a 100%);
  --ink:#ECE6D8; --ink2:rgba(236,230,216,.66); --ink3:rgba(236,230,216,.42);
  --ink4:rgba(236,230,216,.26);
  --hair:rgba(236,230,216,.12); --hair2:rgba(236,230,216,.07);
  --panel:rgba(255,255,255,.028); --panelRing:rgba(255,255,255,.08);
  --panelHi:rgba(255,255,255,.05);
  --chipBg:rgba(236,230,216,.06); --chipRing:rgba(236,230,216,.12);
  --appShadow:0 30px 70px rgba(0,0,0,.55);
  --accentText:#F7C842;
}

/* ============================================================
   LAYOUT PRIMITIVES
   ============================================================ */
.wrap{padding:0 84px}
.band{padding:96px 84px}
.band.tight{padding:74px 84px}
.rule{display:none}

.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--ink3);
  font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--lemon);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--lemon) 20%,transparent)}

h1{font-size:58px;line-height:1.02;letter-spacing:-1.7px;font-weight:700}
h2{font-size:36px;line-height:1.06;letter-spacing:-.9px;font-weight:700}
h3{font-size:19px;line-height:1.2;letter-spacing:-.3px;font-weight:600}
.lead{font-size:18.5px;line-height:1.55;color:var(--ink2);font-weight:400;letter-spacing:-.1px}
.sub{font-size:15.5px;line-height:1.6;color:var(--ink2);letter-spacing:-.1px}
p code,.sub code{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:.86em;
  color:var(--ink);background:var(--chipBg);padding:1px 6px;border-radius:5px;
  box-shadow:inset 0 0 0 .5px var(--chipRing)}
em{font-style:italic;color:var(--ink)}
.lead b,.sub b,.pqsub b{color:var(--ink);font-weight:600}

/* ---- Buttons ---- */
.cta{display:flex;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;
  border-radius:11px;font-size:15px;font-weight:600;letter-spacing:-.2px;cursor:pointer;
  text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--lemon);color:var(--citrus);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 8px 22px rgba(247,200,66,.28)}
.btn.ghost{background:var(--panel);color:var(--ink);
  box-shadow:inset 0 0 0 .5px var(--panelRing)}
.fineprint{margin-top:18px;color:var(--ink3);font-size:12px;letter-spacing:.2px}

/* ============================================================
   NAV
   ============================================================ */
.nav{display:flex;align-items:center;gap:14px;padding:26px 84px 0}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.3px}
.brand .lemon{font-size:19px;line-height:1}
.navlinks{display:flex;gap:26px;margin-left:34px}
.navlinks a{color:var(--ink2);font-size:14px;font-weight:500;text-decoration:none;letter-spacing:-.1px}
.nav .spacer{margin-left:auto}
.nav .ghostlink{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;
  border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;
  background:var(--panel);box-shadow:inset 0 0 0 .5px var(--panelRing)}

/* ============================================================
   HERO
   ============================================================ */
.hero{display:grid;grid-template-columns:452px 1fr;gap:30px;align-items:center;
  padding:64px 84px 86px}
.hero h1{margin:20px 0 0;font-size:58px;letter-spacing:-2px;line-height:.96}
.herokick{margin-top:16px;font-size:25px;line-height:1.12;letter-spacing:-.6px;font-weight:600;color:var(--ink2)}
/* ---- The point (manifesto) ---- */
.pitch{display:grid;grid-template-columns:.92fr 1.08fr;gap:60px;align-items:start}
.pitch-q h2{font-size:60px;line-height:1.0;letter-spacing:-1.6px;font-weight:700;color:var(--ink)}
.pitch-q em{font-style:italic;font-weight:600;color:var(--accentText)}
.pitch-body p{font-size:18px;line-height:1.62;color:var(--ink2);margin-bottom:20px;max-width:48ch}
.pitch-body p:last-child{margin-bottom:0}
.pitch-body b{color:var(--ink);font-weight:700}
.pitch-body code{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:.8em;
  background:var(--chipBg);padding:2px 7px;border-radius:5px;color:var(--ink);
  box-shadow:inset 0 0 0 .5px var(--chipRing)}
.hero .lead{margin:24px 0 34px;max-width:34ch}
.hero-visual{justify-self:end;margin-right:-72px;position:relative}

/* ---- Hero product shot: a macOS desktop ---- */
.macscene{position:relative;width:648px;height:520px;border-radius:18px;overflow:hidden;
  background:
    radial-gradient(58% 46% at 82% 8%, rgba(247,200,66,.34), transparent 62%),
    radial-gradient(66% 58% at 16% 92%, rgba(255,107,70,.26), transparent 60%),
    radial-gradient(50% 50% at 50% 50%, rgba(157,164,245,.16), transparent 70%),
    linear-gradient(158deg,#3b3050 0%,#271f33 52%,#171019 100%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.10),0 50px 110px rgba(16,10,3,.5)}
.menubar{position:relative;z-index:2;display:flex;align-items:center;height:30px;padding:0 13px;
  background:rgba(18,13,9,.40);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:inset 0 -.5px 0 rgba(255,255,255,.12);
  color:rgba(255,255,255,.88);font-size:12.5px;letter-spacing:-.1px}
.mb-left{display:flex;align-items:center;gap:17px}
.mb-apple{display:flex}.mb-apple svg{width:13px;height:15px;display:block;fill:rgba(255,255,255,.95)}
.mb-app{font-weight:700}
.mb-mn{font-weight:500;color:rgba(255,255,255,.74)}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:13px;color:rgba(255,255,255,.82)}
.mb-ic{display:flex}.mb-ic svg{display:block}
.mb-lemon{display:flex;align-items:center;justify-content:center;width:26px;height:22px;
  border-radius:6px;font-size:14px;line-height:1}
.mb-lemon.active{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2)}
.mb-clock{font-weight:500;color:rgba(255,255,255,.9);font-variant-numeric:tabular-nums}
.dropwrap{position:absolute;z-index:3;top:41px;right:118px}
.dropnotch{position:absolute;top:-4px;right:48px;width:12px;height:12px;transform:rotate(45deg);
  background:rgba(40,33,21,.82);box-shadow:inset 1px 1px 0 .5px rgba(255,255,255,.13);z-index:1}
.dock{position:absolute;z-index:2;left:50%;bottom:13px;transform:translateX(-50%);
  display:flex;gap:8px;padding:7px 10px;border-radius:17px;
  background:rgba(255,255,255,.11);backdrop-filter:blur(22px) saturate(1.3);
  -webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2),0 12px 30px rgba(0,0,0,.3)}
.dock span{width:31px;height:31px;border-radius:9px;background:rgba(255,255,255,.16);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
.dock span.lem{background:linear-gradient(160deg,#FBE08A,#F7C842);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3)}

/* hero entrance — one staggered rise on load */
@media (prefers-reduced-motion: no-preference){
  .hero-copy>*{animation:heroRise .7s cubic-bezier(.2,.75,.2,1) both}
  .hero-copy>*:nth-child(2){animation-delay:.06s}
  .hero-copy>*:nth-child(3){animation-delay:.12s}
  .hero-copy>*:nth-child(4){animation-delay:.18s}
  .hero-copy>*:nth-child(5){animation-delay:.24s}
  .macscene{animation:heroRise .85s cubic-bezier(.2,.75,.2,1) both;animation-delay:.12s}
  .dropwrap{animation:dropIn .6s cubic-bezier(.2,.78,.2,1) both;animation-delay:.42s}
}
@keyframes heroRise{from{transform:translateY(16px)}to{transform:none}}
@keyframes dropIn{from{transform:translateY(-10px)}to{transform:none}}

/* ============================================================
   APP UI — rebuilt from the Lemon design system.
   Always warm-dark glass: this is the real surface, floating
   over the desktop in both themes.
   ============================================================ */
.appui{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  color:var(--primary,#ECE6D8)}
.app-primary{color:#ECE6D8}
.pop{position:relative;width:360px;border-radius:16px;overflow:hidden;
  background:rgba(33,27,17,.72);
  backdrop-filter:blur(36px) saturate(1.3);-webkit-backdrop-filter:blur(36px) saturate(1.3);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12),var(--appShadow)}
.pop .head{display:flex;align-items:center;gap:9px;padding:14px 15px 12px}
.pop .head .lg{font-size:16px;line-height:1}
.pop .head .nm{font-size:13.5px;font-weight:700;letter-spacing:-.1px;color:#ECE6D8}
.pop .count{margin-left:auto;display:inline-flex;align-items:center;height:20px;padding:0 10px;
  border-radius:999px;font-size:10.5px;font-weight:600;color:rgba(236,230,216,.66);
  background:rgba(236,230,216,.07);box-shadow:inset 0 0 0 .5px rgba(236,230,216,.13)}
.pop .count i{width:5px;height:5px;border-radius:50%;background:#45C27A;margin-right:6px;
  box-shadow:0 0 0 2.5px rgba(69,194,122,.22)}
.pop .hr{height:.5px;background:rgba(236,230,216,.12)}
.pop .seclabel{color:rgba(236,230,216,.5);font-size:9px;font-weight:700;letter-spacing:1.3px;
  text-transform:uppercase;padding:11px 15px 7px}
.srow{padding:11px 15px 13px;background:rgba(34,28,18,.30)}
.srow+.srow{box-shadow:inset 0 .5px 0 rgba(236,230,216,.08)}
.srow.sel{background:rgba(236,230,216,.05)}
.srow .meta{display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:6px;line-height:1;font-size:11px;
  font-weight:600;color:rgba(236,230,216,.66);white-space:nowrap}
.status .d{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;
  box-shadow:0 0 0 2.5px color-mix(in srgb,var(--c) 18%,transparent)}
.status.live .d{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2.5px color-mix(in srgb,var(--c) 18%,transparent)}
  50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 6%,transparent)}}
.src{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:5px;flex:none}
.src svg{width:11px;height:11px;display:block}
.src.linear{background:rgba(94,106,210,.22);box-shadow:inset 0 0 0 .5px rgba(124,134,232,.48)}
.src.github{background:rgba(150,152,168,.22);box-shadow:inset 0 0 0 .5px rgba(214,216,228,.30)}
.id{font-size:10px;font-weight:600;color:rgba(236,230,216,.5)}
.chev{margin-left:auto;color:rgba(236,230,216,.3);font-size:15px;font-weight:600}
.chev.open{transform:rotate(90deg);color:rgba(236,230,216,.66)}
.srow .ttl{color:#ECE6D8;font-size:12.5px;font-weight:500;line-height:1.35;letter-spacing:-.1px;margin-top:7px}
.term{display:flex;align-items:center;gap:8px;margin-top:10px;background:#17110A;border-radius:7px;
  padding:9px 11px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.05)}
.term .ld{width:6px;height:6px;border-radius:50%;flex:none;background:#45C27A;
  box-shadow:0 0 0 2.5px rgba(69,194,122,.22)}
.term .cmd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10.5px;color:rgba(232,224,204,.82)}
.acts{display:flex;align-items:center;gap:8px;margin-top:10px}
.abtn{display:inline-flex;align-items:center;height:31px;padding:0 14px;border-radius:7px;
  font-size:12px;font-weight:600}
.abtn.primary{background:#F7C842;color:#2D4A1E}
.abtn.stop{color:#FF6B46;background:rgba(236,230,216,.05);box-shadow:inset 0 0 0 .5px rgba(236,230,216,.11)}
.elapsed{margin-left:auto;color:rgba(236,230,216,.5);font-size:10.5px}
.newrow{display:flex;align-items:center;gap:8px;padding:12px 15px;color:rgba(236,230,216,.66);
  font-size:12px;font-weight:500;background:rgba(44,36,23,.42);box-shadow:inset 0 .5px 0 rgba(255,255,255,.10)}
.newrow .plus{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:5px;color:rgba(236,230,216,.66);background:rgba(236,230,216,.09);font-size:13px;
  font-weight:600;line-height:1}
.newrow .kbd{margin-left:auto;color:rgba(236,230,216,.3);font-size:10px}

/* ---- Console / supervisor card ---- */
.console{width:100%;border-radius:13px;overflow:hidden;background:#17110A;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06),var(--appShadow)}
.console .chead{display:flex;align-items:center;gap:9px;padding:13px 16px;
  box-shadow:inset 0 -.5px 0 rgba(255,255,255,.06)}
.console .chead .gd{width:7px;height:7px;border-radius:50%;background:#FF6B46;
  box-shadow:0 0 0 3px rgba(255,107,70,.18)}
.console .chead .who{font-size:11px;font-weight:600;color:rgba(232,224,204,.78)}
.console .chead .verdict{margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#FF6B46}
.console .body{padding:16px 18px 18px;font-size:12.5px;line-height:1.85;color:rgba(232,224,204,.86)}
.console .body .ln{display:flex;gap:10px;white-space:nowrap}
.console .body .k{color:#F7C842}
.console .body .ok{color:#66C78F}
.console .body .warn{color:#FF6B46}
.console .body .dim{color:rgba(232,224,204,.45)}

/* ---- Terminal (setup) ---- */
.terminal{border-radius:13px;overflow:hidden;background:#17110A;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06),var(--appShadow)}
.terminal .bar{display:flex;align-items:center;gap:7px;padding:12px 15px;
  box-shadow:inset 0 -.5px 0 rgba(255,255,255,.06)}
.terminal .bar .dot{width:11px;height:11px;border-radius:50%}
.terminal .bar .t{margin-left:9px;font-size:11px;color:rgba(232,224,204,.5)}
.terminal .body{padding:18px 20px 22px;font-size:13px;line-height:1.95;color:rgba(232,224,204,.9)}
.terminal .body .pr{color:#66C78F}
.terminal .body .cm{color:#F7C842}
.terminal .body .dim{color:rgba(232,224,204,.42)}

/* ---- Phone: remote control ---- */
.phone{position:relative;width:300px;height:614px;border-radius:46px;flex:none;
  background:linear-gradient(155deg,#2b2319 0%,#16110b 100%);padding:11px;
  box-shadow:var(--appShadow),inset 0 0 0 1.5px rgba(255,255,255,.12),inset 0 0 0 7px #0b0805}
.pscreen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;
  background:#FBFAF7;
  display:flex;flex-direction:column}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:86px;height:25px;
  border-radius:13px;background:#000;z-index:6}
.pstat{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 0;
  color:#23211d;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;z-index:4}
.pstat .r{display:flex;align-items:center;gap:6px}
.pstat .r svg{display:block;fill:currentColor}
.papp{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:16px 15px 24px}
.phead{display:flex;align-items:center;gap:9px;padding:2px 3px}
.phead .pback{font-size:21px;line-height:1;color:rgba(236,230,216,.55);margin-right:1px}
.phead .nm{font-size:15px;font-weight:700;color:#ECE6D8;letter-spacing:-.2px}
.phead .ptag{margin-left:auto;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10.5px;
  font-weight:600;color:rgba(236,230,216,.55);padding:3px 9px;border-radius:7px;
  background:rgba(236,230,216,.06);box-shadow:inset 0 0 0 .5px rgba(236,230,216,.12)}
.plink{display:flex;align-items:center;gap:8px;padding:0 4px;font-size:10.5px;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;color:rgba(236,230,216,.5)}
.plink .d{width:6px;height:6px;border-radius:50%;background:#45C27A;flex:none;
  box-shadow:0 0 0 3px rgba(69,194,122,.2)}
.pcard{border-radius:17px;padding:14px;background:rgba(34,28,18,.55);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.09)}
.pcard .ttl{color:#ECE6D8;font-size:14px;font-weight:600;letter-spacing:-.2px;margin-top:9px;line-height:1.3}
.pterm{margin-top:12px;background:#17110A;border-radius:11px;padding:11px 12px;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;line-height:1.75;
  color:rgba(232,224,204,.82);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.05)}
.pterm .k{color:#F7C842}.pterm .ok{color:#66C78F}.pterm .dim{color:rgba(232,224,204,.46)}
.cur{display:inline-block;width:6px;height:13px;vertical-align:-2px;background:#F7C842;
  margin-left:2px;border-radius:1px}
.pconv{flex:1;min-height:0;overflow:hidden;background:#17110A;border-radius:14px;padding:14px;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.8;
  color:rgba(232,224,204,.84);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.05);
  display:flex;flex-direction:column;gap:2px}
.pconv .k{color:#F7C842}.pconv .ok{color:#66C78F}.pconv .dim{color:rgba(232,224,204,.46)}
.pconv .ask{margin-top:11px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-size:12.5px;line-height:1.5;color:#ECE6D8}
.pconv .ask .who{display:block;font-size:8.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:rgba(236,230,216,.4);margin-bottom:4px}
.pquick{display:flex;gap:8px}
.pchip.yes{background:#F7C842;color:#2D4A1E}
.pchip.ghost{background:rgba(236,230,216,.06);color:rgba(236,230,216,.82);box-shadow:inset 0 0 0 .5px rgba(236,230,216,.13)}
.pinput{display:flex;align-items:center;gap:9px;margin-top:11px;height:42px;padding:0 6px 0 14px;
  border-radius:13px;background:rgba(236,230,216,.06);box-shadow:inset 0 0 0 .5px rgba(236,230,216,.14)}
.pinput .ph{flex:1;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12px;color:rgba(236,230,216,.5)}
.pinput .send{width:30px;height:30px;border-radius:9px;background:#F7C842;color:#2D4A1E;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;line-height:1}
.pacts{display:flex;gap:9px;margin-top:11px}
.pchip{flex:1;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  gap:7px;font-size:13px;font-weight:600}
.pchip.attach{background:rgba(236,230,216,.06);color:#ECE6D8;box-shadow:inset 0 0 0 .5px rgba(236,230,216,.14)}
.pchip.pr{background:rgba(69,194,122,.15);color:#66C78F;box-shadow:inset 0 0 0 .5px rgba(69,194,122,.32)}
.phome{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:120px;height:5px;
  border-radius:3px;background:rgba(0,0,0,.32);z-index:5}
/* ---- Claude iOS app (light) ---- */
.capp{position:absolute;inset:0}
.cbar{position:absolute;top:46px;left:0;right:0;display:flex;align-items:center;gap:9px;padding:0 13px;z-index:3}
.cbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);flex:none;
  box-shadow:0 2px 9px rgba(40,30,10,.12),inset 0 0 0 .5px rgba(0,0,0,.05);
  display:flex;align-items:center;justify-content:center;color:#3a352e;font-size:19px}
.cmore{font-size:17px;letter-spacing:1px}
.ctitle{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  background:rgba(255,255,255,.94);border-radius:18px;padding:6px 10px;
  box-shadow:0 2px 9px rgba(40,30,10,.12),inset 0 0 0 .5px rgba(0,0,0,.05)}
.ctitle .t{font-size:12.5px;font-weight:600;color:#1d1b17;max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ctitle .s{font-size:10.5px;color:#9a948a;margin-top:1px}
.cbody{position:absolute;top:108px;left:0;right:0;bottom:160px;overflow:hidden;
  padding:4px 20px;color:#26231e;font-size:13.5px;line-height:1.5}
.cbody p{margin-bottom:12px}
.cbody .m{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:.85em;
  background:rgba(40,30,10,.06);padding:1px 5px;border-radius:5px;color:#3a352e}
.cdock{position:absolute;left:0;right:0;bottom:0;padding:0 13px 18px}
.cchips{display:flex;gap:9px;margin-bottom:10px;padding-left:3px}
.cchip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border-radius:12px;
  background:rgba(255,255,255,.95);font-size:13px;font-weight:600;color:#26231e;
  box-shadow:0 2px 9px rgba(40,30,10,.12),inset 0 0 0 .5px rgba(0,0,0,.05)}
.cchip .plus{color:#2E9E5B;font-weight:700}
.ccomposer{background:rgba(255,255,255,.97);border-radius:24px;padding:15px 16px 12px;
  box-shadow:0 8px 22px rgba(40,30,10,.13),inset 0 0 0 .5px rgba(0,0,0,.05)}
.ccomposer .ph{font-size:14.5px;color:#a39d92}
.crow{display:flex;align-items:center;gap:15px;margin-top:13px}
.crow .ce{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#3a352e;margin-right:auto}
.crow .cdev{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px;color:#8d877c}
.crow .cic{display:flex}.crow .cic svg{width:19px;height:19px;display:block;stroke:#8d877c;fill:none}
.csend{width:31px;height:31px;border-radius:50%;background:#F3C0AE;color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.remote .vizcol{position:relative}
.remote .vizcol::after{content:"";position:absolute;inset:-8% -12%;z-index:-1;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 45%,rgba(247,200,66,.16),transparent 70%)}

/* ============================================================
   THE LOOP (4 steps)
   ============================================================ */
.band-head{max-width:62ch}
.band-head h2{margin:16px 0 0}
.band-head .sub{margin-top:16px;max-width:54ch}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);margin-top:48px}
.steps li{padding:0 26px 0 0;position:relative}
.steps li+li{padding-left:26px;box-shadow:inset .5px 0 0 var(--hair)}
.steps .num{font-size:13px;font-weight:700;color:var(--lemon);letter-spacing:1px}
.steps h3{margin:16px 0 9px}
.steps p{font-size:13.5px;line-height:1.5;color:var(--ink2)}

/* ============================================================
   SPLIT SECTIONS (text + app ui)
   ============================================================ */
.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.split.flip .copycol{order:2}
.split .copycol h2{margin:16px 0 0}
.split .copycol .sub{margin-top:18px;max-width:42ch}
.split .vizcol{display:flex;justify-content:center}
.featlist{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.featlist .fl{display:flex;gap:12px;align-items:flex-start}
.featlist .fl .fi{width:18px;height:18px;border-radius:6px;flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;background:var(--chipBg);
  box-shadow:inset 0 0 0 .5px var(--chipRing);color:var(--ink2);font-size:11px}
.featlist .fl p{font-size:14px;line-height:1.5;color:var(--ink2)}
.featlist .fl b{color:var(--ink);font-weight:600}

/* ---- Silicon strip ---- */
.silicon{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:34px;
  padding-top:26px;box-shadow:inset 0 .5px 0 var(--hair)}
.silicon .sc{font-size:12px;color:var(--ink3);letter-spacing:.2px}
.silicon .sc b{color:var(--ink2);font-weight:600}
.silicon .dotsep{width:3px;height:3px;border-radius:50%;background:var(--ink4)}

/* ============================================================
   TWO-COLUMN CARD SECTIONS (privacy, is/isn't)
   ============================================================ */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:46px}
.card{border-radius:16px;padding:30px 30px 32px;background:var(--panel);
  box-shadow:inset 0 0 0 .5px var(--panelRing)}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.card .ch .tag{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3)}
.card .ch h3{font-size:18px}
.card ul{list-style:none;display:flex;flex-direction:column;gap:15px}
.card li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--ink2)}
.card li b{color:var(--ink);font-weight:600}
.mk{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:700}
.mk.yes{background:color-mix(in srgb,var(--statusDone) 20%,transparent);color:var(--statusDone)}
.mk.out{background:var(--chipBg);box-shadow:inset 0 0 0 .5px var(--chipRing);color:var(--ink3)}
.mk.no{background:color-mix(in srgb,var(--coral) 18%,transparent);color:var(--coral)}

/* ---- Built on (4 mini) ---- */
.recgrid{display:grid;grid-template-columns:1.08fr .92fr;gap:22px;margin-top:46px;align-items:stretch}
.recgrid .console,.recgrid .card,.recgrid .appui{height:100%}
.builton{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:44px}
.dep{border-radius:14px;padding:26px 24px 24px;background:var(--panel);
  box-shadow:inset 0 0 0 .5px var(--panelRing)}
.dep .dn{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.2px}
.dep .dn .ok{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:color-mix(in srgb,var(--statusDone) 22%,transparent);
  color:var(--statusDone);font-size:9px;font-weight:700}
.dep p{margin-top:11px;font-size:13px;line-height:1.55;color:var(--ink3)}
.dep .spec{margin-top:15px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10.5px;
  letter-spacing:.2px;line-height:1.5;color:var(--ink3)}
/* ---- Connect everything ---- */
.srcwall{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px}
.conn{display:inline-flex;align-items:center;gap:11px;padding:10px 16px 10px 11px;border-radius:13px;
  background:var(--panel);box-shadow:inset 0 0 0 .5px var(--panelRing)}
.conn .fav{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.conn .fav svg{width:16px;height:16px;display:block}
.conn .fav.linear{background:rgba(94,106,210,.22);box-shadow:inset 0 0 0 .5px rgba(124,134,232,.48)}
.conn .fav.github{background:var(--chipBg);box-shadow:inset 0 0 0 .5px var(--chipRing)}
.conn .meta2{display:flex;flex-direction:column;line-height:1.15}
.conn .cn{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.conn .ck{font-size:10px;color:var(--ink3);font-family:"SF Mono",ui-monospace,Menlo,monospace;margin-top:2px}
.conn.add{color:var(--ink3);font-weight:600;font-size:13.5px;padding:10px 17px;cursor:pointer}

/* ============================================================
   SETUP
   ============================================================ */
.setup{display:grid;grid-template-columns:.82fr 1.18fr;gap:54px;align-items:center}
.setup .copycol h2{margin:16px 0 0}
.setup .copycol .sub{margin-top:16px;max-width:36ch}

/* ============================================================
   FOOTER
   ============================================================ */
.foot{display:flex;align-items:center;gap:14px;padding:40px 84px 46px;
  box-shadow:inset 0 .5px 0 var(--hair)}
.foot .brand{font-size:15px}
.foot .fl{margin-left:auto;display:flex;gap:24px}
.foot a{color:var(--ink3);font-size:13px;text-decoration:none}
.foot .cp{color:var(--ink4);font-size:12px;letter-spacing:.2px}

/* ---- Pull quote ---- */
.pullquote{position:relative;padding:108px 84px}
.pullquote blockquote{margin:22px 0 0;font-size:48px;line-height:1.04;letter-spacing:-1.4px;
  font-weight:700;color:var(--ink);max-width:15ch}
.pullquote .pqsub{margin-top:24px;font-size:16.5px;line-height:1.62;color:var(--ink2);max-width:48ch}

/* reduced motion */
@media (prefers-reduced-motion: reduce){ .status.live .d{animation:none} }
</style>
</head>

  <div class="rule"></div>

  <!-- THE LOOP -->
  <section class="band">
    <div class="band-head">
      <span class="eyebrow"><i></i>The loop</span>
      <h2>Claude takes the cruft.<br>You keep the keys.</h2>
      <p class="sub">This isn't fire-and-forget. Lemon is built on Claude's remote control — so you can read along, drop into the live terminal, and steer the moments that matter, while Claude and Gemma grind through the parts that don't.</p>
    </div>
    <ol class="steps">
      <li>
        <div class="num mono">01</div>
        <h3>You tag it</h3>
        <p>Add the 🍋 label and Claude starts on the cruft — scaffolding, wiring, the busywork — in its own git worktree, never touching the files you're editing.</p>
      </li>
      <li>
        <div class="num mono">02</div>
        <h3>You watch it live</h3>
        <p>Every session streams to the menu bar. Open the terminal and read along, line by line, as the agent works.</p>
      </li>
      <li>
        <div class="num mono">03</div>
        <h3>You step in</h3>
        <p>Join the running session and type. Steer a decision, correct a path, then hand it back — it's your keyboard whenever you want it.</p>
      </li>
      <li>
        <div class="num mono">04</div>
        <h3>You ship it</h3>
        <p>Claude pauses at the calls that matter and opens the PR. Human in the loop where it counts, minus the cruft.</p>
      </li>
    </ol>
  </section>

  <div class="rule"></div>

  <!-- ORCHESTRATOR -->
  <section class="band split">
    <div class="copycol">
      <span class="eyebrow"><i></i>The orchestrator</span>
      <h2>It lives in the menu bar — not a tab.</h2>
      <p class="sub">Every active session sits one click off the menu bar, over your real desktop. A resting row whispers; a live agent shows its terminal and the two actions that matter.</p>
      <div class="featlist">
        <div class="fl"><span class="fi">›</span><p><b>One yellow moment.</b> Color is spent on a single primary action per surface — never on decoration.</p></div>
        <div class="fl"><span class="fi">◵</span><p><b>Status is a dot.</b> Planning, executing, waiting, done — read at a glance, never a wall of badges.</p></div>
        <div class="fl"><span class="fi">⌘</span><p><b>Open or stop, instantly.</b> Jump into the live terminal or halt the agent without leaving the corner.</p></div>
      </div>
    </div>
    <div class="vizcol">
      <div class="appui">
        <div class="pop">
          <div class="head">
            <span class="lg">🍋</span>
            <span class="nm">Lemon</span>
            <span class="count"><i></i>1 running</span>
          </div>
          <div class="hr"></div>
          <div class="seclabel">Sessions</div>

              <span class="src linear"><svg viewBox="0 0 12 12" aria-hidden="true"><g fill="var(--linearMark)"><rect transform="rotate(45 6 6)" x="0.6" y="2.9" width="10.8" height="1.5" rx=".75"></rect><rect transform="rotate(45 6 6)" x="0.6" y="5.25" width="10.8" height="1.5" rx=".75"></rect><rect transform="rotate(45 6 6)" x="0.6" y="7.6" width="10.8" height="1.5" rx=".75"></rect></g></svg></span>
              <span class="id mono">LEM-42</span>
              <span class="chev open">›</span>
            </div>
            <div class="ttl">Wire up the Liquid Glass token set</div>
            <div class="term">
              <span class="ld"></span>
              <span class="cmd mono">› npm run check:tokens — 0 errors</span>
            </div>
            <div class="acts">
              <span class="abtn primary">Open terminal</span>
              <span class="abtn stop">Stop agent</span>
              <span class="elapsed mono">running 4m</span>
            </div>
          </div>
          <div class="srow">
            <div class="meta">
              <span class="status" style="--c:var(--statusDone)"><span class="d"></span>Done</span>
              <span class="src linear"><svg viewBox="0 0 12 12" aria-hidden="true"><g fill="var(--linearMark)"><rect transform="rotate(45 6 6)" x="0.6" y="2.9" width="10.8" height="1.5" rx=".75"></rect><rect transform="rotate(45 6 6)" x="0.6" y="5.25" width="10.8" height="1.5" rx=".75"></rect><rect transform="rotate(45 6 6)" x="0.6" y="7.6" width="10.8" height="1.5" rx=".75"></rect></g></svg></span>
              <span class="id mono">LEM-39</span>
              <span class="chev">›</span>
            </div>
            <div class="ttl">Public-readiness scaffolding + CI</div>
          </div>
          <div class="newrow">
            <span class="plus">+</span>
            <span>New session…</span>
            <span class="kbd mono">⌘N</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="rule"></div>

  <!-- CONNECT EVERYTHING -->
  <section class="band">
    <div class="band-head">
      <span class="eyebrow"><i></i>Connect everything</span>
      <h2>One menu bar. Every repo you touch.</h2>
      <p class="sub">Attach as many Linear teams and GitHub repositories as you like. Lemon watches them all at once, routes each tagged issue to the right repo, and keeps every running session in a single list.</p>
    </div>

        <div class="fl"><span class="fi">⌨</span><p><b>Reply to steer.</b> Answer Claude's question or redirect it with a line — even from the lock screen.</p></div>
        <div class="fl"><span class="fi">✓</span><p><b>Approve from anywhere.</b> Read the diff and merge the PR without opening a laptop.</p></div>

      <h2>The point<br>isn’t <em>“Claude,<br>but in a menu<br>bar.”</em></h2>
    </div>
    <div class="pitch-body">
      <p>It’s <b>skipping the routine parts</b> — the tags you’d kickstart by hand anyway, the trust prompts you’d answer the same way every time, the PR wait you’d just sit through. Lemon orchestrates those out of your day.</p>
      <p>And it makes <b>your issue tracker the surface</b>, not a separate dashboard. Linear, GitHub Issues, or both — you’ve been triaging there all morning anyway. Tag the ones you want kickstarted, get back to the work that actually needs your head.</p>
      <p>And you stay <b>in the driver’s seat for the questions that actually matter.</b> Claude Code’s <code>--remote-control</code> flag pushes them straight to the Claude iOS app on your phone. The design judgment calls, the ambiguous-tradeoff prompts, the “should this be a refactor or a band-aid?” moments — those reach you wherever you are. Lemon and Gemma absorb the rest.</p>

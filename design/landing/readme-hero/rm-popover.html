<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-feature-settings:"ss01"}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:grid;place-items:center}
.frame{display:grid;place-items:center}
/* warm-dark glass card */
.card{background:rgba(24,18,11,.95);border-radius:16px;color:#ECE6D8;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.10),
             inset 0 1px 0 rgba(255,255,255,.05),
             0 30px 70px rgba(8,5,2,.5)}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.src{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:6px;font-size:10px;font-weight:700;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;color:#EAAE3A;
  background:rgba(234,174,58,.13);box-shadow:inset 0 0 0 .5px rgba(234,174,58,.30)}
.src.gh{color:#6BD180;background:rgba(107,209,128,.12);box-shadow:inset 0 0 0 .5px rgba(107,209,128,.30)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  color:#C9C2B2;background:rgba(255,255,255,.05);padding:4px 9px;border-radius:999px;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}

.frame{width:100vw;min-height:100vh}</style></head><body>
<div class="frame"><div class="card" style="width:404px;overflow:hidden">
  <div style="height:3px;background:linear-gradient(90deg,#F7C842,rgba(247,200,66,0))"></div>
  <div style="display:flex;align-items:center;gap:8px;padding:14px 16px 12px;box-shadow:inset 0 -.5px 0 rgba(255,255,255,.08)">
    <span style="font-size:14px;font-weight:700">🍋 Lemon</span>
    <span class="dot" style="background:#F7C842;box-shadow:0 0 7px #F7C842;margin-left:2px"></span>
    <span class="chip" style="margin-left:auto"><span class="dot" style="background:#45C27A;box-shadow:0 0 7px #45C27A"></span>2 active</span>
  </div>
  <div style="display:flex;padding:13px 16px;box-shadow:inset 0 -.5px 0 rgba(255,255,255,.07);"><span style="width:3px;align-self:stretch;border-radius:2px;background:#F7C842;margin:2px 12px 2px 0"></span>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px"><span class="src">L</span>
          <span class="mono" style="font-size:11px;font-weight:600;color:#A9A293">LEM-42</span>
          <span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#C9C2B2"><span class="dot" style="background:#F7C842;box-shadow:0 0 7px #F7C842"></span>Executing</span></div>
        <div style="margin-top:7px;font-size:13px;font-weight:500;color:#ECE6D8;letter-spacing:-.1px">Wire up the Liquid Glass token set</div>
        <div class="mono" style="margin-top:9px;font-size:11.5px;color:#C9BFA6;background:#17110A;padding:8px 11px;border-radius:9px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.05);white-space:nowrap">› claude --permission-mode auto …</div></div></div>
  <div style="display:flex;padding:13px 16px;box-shadow:inset 0 -.5px 0 rgba(255,255,255,.07);"><span style="width:3px;align-self:stretch;border-radius:2px;background:#FF6B46;margin:2px 12px 2px 0"></span>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px"><span class="src gh">gh</span>
          <span class="mono" style="font-size:11px;font-weight:600;color:#A9A293">acme/web#7</span>
          <span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#C9C2B2"><span class="dot" style="background:#FF6B46;box-shadow:0 0 7px #FF6B46"></span>Waiting</span></div>
        <div style="margin-top:7px;font-size:13px;font-weight:500;color:#ECE6D8;letter-spacing:-.1px">Re-trigger fires on shipped revisions</div>
        </div></div>
  <div style="display:flex;padding:13px 16px;"><span style="width:3px;align-self:stretch;border-radius:2px;background:#45C27A;margin:2px 12px 2px 0"></span>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px"><span class="src">L</span>
          <span class="mono" style="font-size:11px;font-weight:600;color:#A9A293">LEM-39</span>
          <span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#C9C2B2">Done</span></div>
        <div style="margin-top:7px;font-size:13px;font-weight:500;color:#ECE6D8;letter-spacing:-.1px">Public-readiness scaffolding + CI</div>
        </div></div>
</div></div></body></html>

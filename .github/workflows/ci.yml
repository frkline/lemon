name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version

      - name: Build (warnings as errors)
        run: |
          xcodebuild -project app/Lemon.xcodeproj -scheme Lemon -configuration Debug \
            ONLY_ACTIVE_ARCH=YES OTHER_SWIFT_FLAGS="-warnings-as-errors" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test
        run: |
          xcodebuild -project app/Lemon.xcodeproj -scheme Lemon -configuration Debug \
            ONLY_ACTIVE_ARCH=YES OTHER_SWIFT_FLAGS="-warnings-as-errors" \
            CODE_SIGNING_ALLOWED=NO -destination 'platform=macOS' test
